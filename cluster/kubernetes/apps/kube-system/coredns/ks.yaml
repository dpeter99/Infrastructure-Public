---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coredns
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/kube-system/coredns/app
  prune: true
  targetNamespace: kube-system
  dependsOn:
    - name: cilium
  wait: false
  sourceRef:
    kind: OCIRepository
    name: flux-system