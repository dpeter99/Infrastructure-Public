---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: flux-operator
  namespace: flux-system
spec:
  interval: 1h
  path: ./apps/flux-system/flux-operator/app
  prune: true
  targetNamespace: flux-system
  wait: false
  sourceRef:
    kind: OCIRepository
    name: flux-system