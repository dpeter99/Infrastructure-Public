---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: echo
spec:
  interval: 1h
  path: ./apps/default/echo/app
  postBuild:
    substituteFrom:
      - name: cluster-secrets
        kind: Secret  
  prune: true
  sourceRef:
    kind: OCIRepository
    name: flux-system
    namespace: flux-system    
  targetNamespace: default
  wait: false