[artifact]
# OCI repository that `just push` publishes the rendered kubernetes manifests
# to, tagged with the git sha and `latest` (which Flux tracks).
url = "oci://ghcr.io/dpeter99/aper-cluster"
# 1Password secret references (op://<vault>/<item>/<field>) for the registry
# username and token. `just login` and the in-cluster pull secret both read
# them with `op read`; the values themselves never land in this repo.
op_username = "op://Private/Aper Cluser GHCR/username"
op_token = "op://Private/Aper Cluser GHCR/credential"

[network]
gateway = "10.90.0.1"
node_cidr = "10.90.2.0/24"

[network.bgp]
cluster_asn = "64513"

router_asn = "64512"

[kubernetes]

pod_cidr = "10.94.0.0/16"
svc_cidr = "10.95.0.0/16"

[kubernetes.api]

# Virtual IP for the Kubernetes API server. kubectl, flux, and every other
# client connect here on port 6443. Must be an unused IP inside
# network.node_cidr — kube-vip floats it across controller nodes.
# REQUIRED.
addr = "10.90.2.100"

[gateways]

internal = "10.90.2.201"